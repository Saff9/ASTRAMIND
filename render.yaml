services:
  - type: web
    name: astramind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Use uvicorn directly — no separate gunicorn_conf.py dependency
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://astramind-lake.vercel.app,https://astramind-reer.onrender.com
      - key: PORT
        value: "10000"
      - key: DISABLE_BACKGROUND_TASKS
        value: "0"
      # SSE/chat streams can exceed default 60s worker timeout
      - key: GUNICORN_TIMEOUT
        value: "300"
      # Add your AI provider keys in Render dashboard:
      # GROQ_API_KEYS, ANTHROPIC_API_KEYS, GOOGLE_AI_STUDIO_API_KEYS, etc.
    healthCheckPath: /api/v1/health
    autoDeploy: true
