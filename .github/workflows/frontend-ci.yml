name: Frontend CI — Build & Lint

on:
  push:
    branches: [main, master]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**']

jobs:
  build:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc --noEmit
        continue-on-error: true  # Warn but don't block on type errors

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://astramind-reer.onrender.com
          # Use dummy keys for build-time checks only
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: next-build-${{ github.sha }}
          path: frontend/.next/
          retention-days: 3
